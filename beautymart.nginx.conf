upstream beautymart_app {
    server 127.0.0.1:3055 fail_timeout=0;
}

# HTTP Reverse Proxy (Port 3050)
server {
    listen 3050;
    listen [::]:3050;
    server_name manziq.ddns.net app.manzomaiq.com 2.28.56.191 localhost _;

    client_max_body_size 50M;

    access_log /var/log/nginx/beautymart_access.log combined;
    error_log /var/log/nginx/beautymart_error.log warn;

    location / {
        proxy_pass http://beautymart_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTPS Reverse Proxy (Port 8445 with SSL)
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    http2 on;
    server_name manziq.ddns.net app.manzomaiq.com 2.28.56.191;

    ssl_certificate /etc/letsencrypt/live/manziq.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manziq.ddns.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    access_log /var/log/nginx/beautymart_ssl_access.log combined;
    error_log /var/log/nginx/beautymart_ssl_error.log warn;

    location / {
        proxy_pass http://beautymart_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
